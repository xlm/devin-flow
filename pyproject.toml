[project]
name = "devin-flow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["devin-flow-backend"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
devin-flow-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "testcontainers[postgres]",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/src", "backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--import-mode=importlib --strict-markers --cov=devin_flow --cov-report=term-missing --cov-fail-under=100"
markers = [
    "docker: needs a Docker daemon (testcontainers Postgres)",
    "live: hits the real Devin API, needs DEVIN_API_TOKEN",
]

[tool.coverage.run]
source = ["backend/src"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

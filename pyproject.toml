[project]
name = "devin-flow"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["devin-flow-backend"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
devin-flow-backend = { workspace = true }

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["backend/src", "backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--import-mode=importlib"

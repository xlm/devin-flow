repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint and format check
        entry: sh -c 'pnpm --filter frontend lint && pnpm --filter frontend format:check'
        language: system
        files: ^frontend/
        pass_filenames: false

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: devin
      POSTGRES_PASSWORD: devin
      POSTGRES_DB: devin_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devin -d devin_flow"]
      interval: 2s
      timeout: 5s
      retries: 15

  # runs alembic upgrade head, then uvicorn on :8000
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://devin:devin@db:5432/devin_flow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # one-shot: docker compose run --rm seed
  # migrates first so it does not race the app container's alembic run
  seed:
    build: .
    entrypoint: ["sh", "-c", "alembic -c /app/backend/alembic.ini upgrade head && seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://devin:devin@db:5432/devin_flow
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

volumes:
  pgdata:

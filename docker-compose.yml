# Devin variables pass through from the shell or the root .env (compose reads
# it); left optional here so `docker compose up -d db` works without them,
# Settings rejects empty credentials when migrate, app or seed starts
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://devin:devin@db:5432/devin_flow
  DEVIN_API_TOKEN: ${DEVIN_API_TOKEN:-}
  DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
  DEVIN_API_BASE_URL: ${DEVIN_API_BASE_URL:-https://api.devin.ai/v3}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: devin
      POSTGRES_PASSWORD: devin
      POSTGRES_DB: devin_flow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devin -d devin_flow"]
      interval: 2s
      timeout: 5s
      retries: 15

  # one-shot alembic upgrade head, gates app and seed so only one migrates
  migrate:
    build: .
    entrypoint: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy

  # entrypoint re-runs alembic (a no-op here), then uvicorn on :8000
  app:
    build: .
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # one-shot: docker compose run --rm seed
  seed:
    build: .
    entrypoint: ["seed"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

volumes:
  pgdata:

[project]
name = "devin-flow-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "httpx",
]

[project.scripts]
seed = "devin_flow.seed:main"
sync-playbooks = "devin_flow.playbooks:main"
simulate-issues = "devin_flow.simulate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_flow"]
artifacts = ["src/devin_flow/simulate/scenario.toml", "src/devin_flow/simulate/patches/*.patch"]

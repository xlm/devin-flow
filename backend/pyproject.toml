[project]
name = "devin-flow-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "httpx",
]

[project.scripts]
seed = "devin_flow.seed:main"
sync-playbooks = "devin_flow.playbooks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_flow"]

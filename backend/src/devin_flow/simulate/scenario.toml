[[issues]]
id = "date-parser-offset"
phase = "original"
expected_outcome = "fixed"
title = "Relative time filters move in the wrong direction"
body = """### Bug description
Relative time filters such as `30 seconds ago` move the query window forward instead of backward.

### How to reproduce the bug
1. Open a chart with a time range filter.
2. Use `30 seconds ago` as the range.
3. Compare the generated start time with the current time.

### Screenshots/recordings
Not available.

### Superset version
0.0.0-dev

### Python version
3.11

### Node version
20

### Browser
Chrome 120

### Additional context
The same behavior affects minutes, hours, days, and quarters when the expression uses `ago`.

### Checklist
- [x] I have searched existing issues.
- [x] I have reproduced this on the default branch.
"""

[[issues]]
id = "email-attachment-default"
phase = "original"
expected_outcome = "fixed"
title = "Attachments without a recognized extension have the wrong MIME type"
body = """### Bug description
An exported attachment with an extension that Superset does not recognize is labelled as `application/plain` instead of a generic binary attachment.

### How to reproduce the bug
1. Export content using an unrecognized extension such as `.unknown`.
2. Inspect the MIME type in the generated email.
3. Observe that it is reported as `application/plain`.

### Screenshots/recordings
Not available.

### Superset version
0.0.0-dev

### Python version
3.11

### Node version
20

### Browser
Chrome 120

### Additional context
Known extensions such as `.zip` and `.xlsx` keep their expected MIME types.

### Checklist
- [x] I have searched existing issues.
- [x] I have reproduced this on the default branch.
"""

[[issues]]
id = "sql-identifier-quotes"
phase = "original"
expected_outcome = "fixed"
title = "Malformed quoted identifiers are silently changed"
body = """### Bug description
SQL identifier cleanup removes the first and last character from a malformed identifier when only one side is quoted.

### How to reproduce the bug
1. Pass an identifier containing an unmatched quote to SQL parsing.
2. Inspect the identifier used for validation or display.
3. Observe that its boundary characters have been removed even though they do not form a pair.

### Screenshots/recordings
Not available.

### Superset version
0.0.0-dev

### Python version
3.11

### Node version
20

### Browser
Chrome 120

### Additional context
Balanced single, double, and backtick quotes should continue to be removed as before.

### Checklist
- [x] I have searched existing issues.
- [x] I have reproduced this on the default branch.
"""

